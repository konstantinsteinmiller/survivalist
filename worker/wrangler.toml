name = "survivalist-leaderboard"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[[d1_databases]]
binding = "DB"
database_name = "survivalist-leaderboard"
# Replace with the id `wrangler d1 create survivalist-leaderboard` prints.
database_id = "a7845c12-395d-4d6a-9cac-b44a056cf4eb"

[vars]
# Empty = allow any origin. Every portal build serves the game from a different
# origin and a sandboxed iframe sends `null`, so an allowlist is opt-in.
ALLOWED_ORIGINS = ""
# SCORE_SECRET is deliberately NOT here — `wrangler secret put SCORE_SECRET`.
